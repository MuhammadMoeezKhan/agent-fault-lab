[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fault-lab"
version = "0.2.0"
description = "Fault injection and state-checked audits for tool-calling agents and their tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Moeez Khan" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["nbformat", "nbclient", "ipykernel"]

[project.scripts]
agent-fault-lab = "agentfaultlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
