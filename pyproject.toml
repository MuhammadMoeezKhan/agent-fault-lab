[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fault-lab"
version = "0.1.0"
description = "Seeded fault injection and reliability metrics for tool-calling agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Moeez Khan" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["nbformat", "nbclient", "ipykernel"]

[project.scripts]
agent-fault-lab = "agentfaultlab.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
